<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <!-- 유니티 기본 스타일(로딩바·푸터) 먼저, 페이지 레이아웃을 뒤에 두어 덮어쓴다 -->
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="stylesheet" href="style.css">
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
#if DEVELOPMENT_PLAYER
    <script src="<<<TemplateData/profiler.js>>>"></script>
#endif
  </head>
  <body>
    <!-- 상단 바: 왼쪽 드로어 버튼, 가운데 타이틀 -->
    <header id="topbar">
      <button id="drawer-open" type="button" aria-controls="drawer" aria-expanded="false" aria-label="메뉴 열기">☰</button>
      <h1 id="topbar-title">Tale Tail</h1>
    </header>

    <main id="main">
      <!-- 유니티 캔버스: 페이지의 주요소 -->
      <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-warning"> </div>
        <div id="unity-footer">
          <div id="unity-logo-title-footer"></div>
          <div id="unity-fullscreen-button"></div>
#if SHOW_DIAGNOSTICS
          <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
#endif
          <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
        </div>
      </div>

      <!-- 한 줄 일기 입력 -->
      <form id="diary-form" autocomplete="off">
        <input id="diary-input" type="text" name="entry" placeholder="오늘 하루를 한 줄로 남겨보세요" maxlength="100">
        <button id="diary-submit" type="submit">기록</button>
      </form>
    </main>

    <!-- 좌측 드로어: 화면 위에 겹쳐 열리므로 캔버스는 계속 살아있다 -->
    <aside id="drawer" aria-label="사이드 메뉴">
      <div id="drawer-header">
        <button id="drawer-close" type="button" aria-label="메뉴 닫기">✕</button>
      </div>

      <section class="drawer-section">
        <h2>회고</h2>
        <div class="placeholder placeholder-calendar">캘린더 자리</div>
      </section>

      <section class="drawer-section">
        <h2>감정 흐름</h2>
        <div class="placeholder placeholder-chart">차트 자리</div>
      </section>

      <section class="drawer-section">
        <h2>설정</h2>
        <div class="setting-row">
          <span>다크 모드</span>
          <span class="badge">확장 예정</span>
        </div>
      </section>
    </aside>

    <script src="app.js"></script>
  </body>
</html>
